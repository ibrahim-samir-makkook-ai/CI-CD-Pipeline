services:
  app:
    # For local dev: build from Dockerfile
    # For staging/prod: pull from GHCR (use TAG env: staging / stable / latest)
    #   TAG=staging docker compose pull && TAG=staging docker compose up -d  (staging host)
    #   TAG=stable  docker compose pull && TAG=stable  docker compose up -d  (prod host)
    build: .
    image: ghcr.io/ibrahim-samir-makkook-ai/ci-cd-pipeline:${TAG:-staging}
    ports:
      - "5000:5000"
    container_name: ci-cd-pipeline-test
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-${TAG:-staging}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
