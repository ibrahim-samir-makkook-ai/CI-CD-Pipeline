services:
  app:
    # For local dev: build from Dockerfile
    # For staging/prod: pull from GHCR (override with `docker compose pull`)
    build: .
    image: ghcr.io/isamir0/ci-cd-pipeline-test:staging
    ports:
      - "5000:5000"
    container_name: ci-cd-pipeline-test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
