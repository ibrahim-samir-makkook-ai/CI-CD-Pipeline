name: CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  publish-staging:
    runs-on: ubuntu-latest
    concurrency:
      group: staging-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: staging
      url: https://ghcr.io/${{ github.repository }}:staging
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (staging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push to GHCR (staging) — single build
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Show staging image
        run: |
          echo "Staging pushed: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Use this digest to promote to production or rollback"

      - name: Deploy and test staging artifact
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}:staging" | tr '[:upper:]' '[:lower:]')
          echo "Pulling staging image $IMAGE"
          docker pull "$IMAGE"
          echo "Running staging container"
          docker run -d -p 5000:5000 --name staging-test "$IMAGE"
          echo "Waiting for app to be ready..."
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5000/health; then
              echo "Staging health OK"
              break
            fi
            echo "Attempt $i/15 failed, retrying in 1s..."
            if [ "$i" -eq 15 ]; then
              echo "Staging failed to start"
              docker logs staging-test
              docker rm -f staging-test || true
              exit 1
            fi
            sleep 1
          done
          curl --fail http://localhost:5000/ || (docker logs staging-test && exit 1)
          echo "Staging smoke tests passed"
          docker logs staging-test || true
          docker rm -f staging-test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: publish-staging
    # Skip remote deploy if no host configured — GHCR-only mode stays green
    if: ${{ secrets.STAGING_HOST != '' }}
    concurrency:
      group: staging-deploy-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: staging
      url: http://${{ secrets.STAGING_HOST }}:5000
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}:staging" | tr '[:upper:]' '[:lower:]')
            echo "Logging into GHCR"
            # Prefer GHCR_PAT (persistent), fallback to GITHUB_TOKEN
            TOKEN="${{ secrets.GHCR_PAT }}"
            if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
            cd "${{ secrets.STAGING_PATH || '/opt/ci-cd-pipeline' }}"
            echo "Deploying with docker compose"
            TAG=staging docker compose pull
            TAG=staging docker compose up -d
            echo "Waiting for /health..."
            for i in $(seq 1 15); do
              if curl --fail http://localhost:5000/health; then echo "Staging health OK"; break; fi
              echo "attempt $i/15 failed, retrying in 2s..."
              if [ "$i" -eq 15 ]; then echo "Healthcheck failed"; docker compose logs --tail 100 || true; exit 1; fi
              sleep 2
            done
            curl --fail http://localhost:5000/ | head -c 300; echo
            echo "Staging deploy complete — digest ${{ needs.publish-staging.outputs.digest }}"
            docker compose ps || docker ps | head -20

  publish-production:
    runs-on: ubuntu-latest
    needs: publish-staging
    # To enforce staging host must be healthy before promotion, change to:
    # needs: [publish-staging, deploy-staging]
    concurrency:
      group: production
      cancel-in-progress: true
    # Manual approval gate: configure in GitHub UI
    # Settings > Environments > production > Required reviewers: add 1+ reviewer
    # This job will pause with "Waiting for approval" until reviewer approves
    # stale Waiting runs are auto-canceled on new push (concurrency: production, cancel: true)
    environment:
      name: production
      url: https://ghcr.io/${{ github.repository }}:latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (production)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=stable
          flavor: |
            latest=false
          # Decision: semver canceled, SBOM/provenance disabled for minimal GHCR-only.
          # Staging validates artifact; production reuses same digest via imagetools.
          # SHA tag already exists from staging (same digest) — not recreated here.

      - name: Guard against stale promotion
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          EXPECTED="${{ needs.publish-staging.outputs.digest }}"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Stale check failed: expected digest empty"
            exit 1
          fi
          SRC="${IMAGE}@${EXPECTED}"
          echo "Expected digest from staging: $EXPECTED"
          # Fetch current staging digest from GHCR (explicit stale check beyond concurrency)
          # Prefer crane if available, fallback to imagetools inspect
          if command -v crane >/dev/null 2>&1; then
            CURRENT=$(crane digest "${IMAGE}:staging" 2>/dev/null || true)
          else
            # Try imagetools inspect --raw with jq
            RAW=$(docker buildx imagetools inspect "${IMAGE}:staging" --raw 2>/dev/null || true)
            if echo "$RAW" | grep -q '"digest"'; then
              CURRENT=$(echo "$RAW" | jq -r '.manifests[0].digest // .config.digest // empty' 2>/dev/null || true)
            fi
            if [ -z "$CURRENT" ]; then
              CURRENT=$(docker buildx imagetools inspect "${IMAGE}:staging" 2>&1 | grep -o 'sha256:[a-f0-9]\{64\}' | head -1 || true)
            fi
          fi
          echo "Current staging digest in registry: ${CURRENT:-<unknown>}"
          if [ -n "$CURRENT" ] && [ "$EXPECTED" != "$CURRENT" ]; then
            echo "::error::Stale promotion blocked: staging has moved to $CURRENT but this run wants to promote $EXPECTED"
            echo "A newer staging push exists — approve the latest run instead."
            exit 1
          fi
          # Also verify source exists
          docker buildx imagetools inspect "$SRC" || (echo "::error::Source $SRC not found" && exit 1)
          echo "Stale check passed — promoting $SRC"

      - name: Promote staging digest to production (imagetools, no rebuild)
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ needs.publish-staging.outputs.digest }}"
          SRC="${IMAGE}@${DIGEST}"
          echo "Source (staging digest): $SRC"
          echo "Production tags: ${{ steps.meta.outputs.tags }}"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating tag: $TAG -> $SRC"
            docker buildx imagetools create --tag "$TAG" "$SRC"
          done
          echo "Production promotion complete (manual approval was required)"
          docker buildx imagetools inspect "${IMAGE}:latest" || true
          docker buildx imagetools inspect "${IMAGE}:stable" || true

      - name: Summary
        run: |
          echo "### CD Production Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Tags: \`${{ steps.meta.outputs.tags }}\`" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "Source digest: \`${{ needs.publish-staging.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rollback with digest (immutable):" >> $GITHUB_STEP_SUMMARY
          echo "\`docker buildx imagetools create --tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}@sha256:<digest>\`" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    runs-on: ubuntu-latest
    needs: publish-production
    # Skip remote deploy if no prod host configured — GHCR promotion still happens
    if: ${{ secrets.PROD_HOST != '' }}
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    # Single approval gate is on publish-production. This job runs auto after approval.
    # No `environment: production` here to avoid second approval. Use non-protected env for URL tracking if needed:
    # environment:
    #   name: production-deploy
    #   url: http://${{ secrets.PROD_HOST }}:5000
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}:stable" | tr '[:upper:]' '[:lower:]')
            echo "Logging into GHCR"
            TOKEN="${{ secrets.GHCR_PAT }}"
            if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
            echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
            cd "${{ secrets.PROD_PATH || '/opt/ci-cd-pipeline' }}"
            echo "Deploying production with docker compose"
            TAG=stable docker compose pull
            TAG=stable docker compose up -d
            echo "Waiting for /health..."
            for i in $(seq 1 15); do
              if curl --fail http://localhost:5000/health; then echo "Production health OK"; break; fi
              echo "attempt $i/15 failed, retrying in 2s..."
              if [ "$i" -eq 15 ]; then echo "Healthcheck failed"; docker compose logs --tail 100 || true; exit 1; fi
              sleep 2
            done
            curl --fail http://localhost:5000/ | head -c 300; echo
            echo "Production deploy complete"
            docker compose ps || docker ps | head -20

  notify-staging:
    runs-on: ubuntu-latest
    needs: [publish-staging, deploy-staging]
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Resolve reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let logins = [];
            try {
              const env = await github.rest.repos.getEnvironment({
                owner: context.repo.owner, repo: context.repo.repo, environment_name: 'production'
              });
              for (const r of (env.data.protection_rules || [])) for (const rev of (r.reviewers || [])) {
                const v = rev.reviewer; if (v?.login) logins.push(v.login);
                else if (v?.slug) { try { const ms = await github.rest.teams.listMembersInOrg({ org: context.repo.owner, team_slug: v.slug }); ms.data.forEach(m => logins.push(m.login)); } catch(e){ logins.push(v.slug); } }
              }
            } catch(e) { core.warning(e.message); }
            if (!logins.length) logins = [context.repo.owner];
            logins = [...new Set(logins)];
            core.setOutput('logins', logins.join(','));

      - name: Fetch CI status (for combined CI+CD staging email)
        id: ci
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let ci = { lint: 'skipped', test: 'skipped', docker: 'skipped' };
            let found = false;
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ci.yml', per_page: 10
              });
              const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha);
              if (run) {
                core.info(`Found CI run ${run.id} conclusion=${run.conclusion} status=${run.status}`);
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 20
                });
                for (const j of jobs.data.jobs) {
                  const n = j.name.toLowerCase();
                  if (n.includes('lint')) ci.lint = j.conclusion || j.status;
                  else if (n.includes('test')) ci.test = j.conclusion || j.status;
                  else if (n.includes('docker')) ci.docker = j.conclusion || j.status;
                }
                found = true;
              } else {
                core.warning('CI run not found for sha ' + context.sha);
              }
            } catch(e) { core.warning('CI fetch failed: ' + e.message); }
            core.setOutput('lint', ci.lint);
            core.setOutput('test', ci.test);
            core.setOutput('docker', ci.docker);
            core.setOutput('found', String(found));
            core.info(`CI: ${JSON.stringify(ci)}`);

      - name: Build minimal staging message
        id: msg
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
          CI_LINT: ${{ steps.ci.outputs.lint }}
          CI_TEST: ${{ steps.ci.outputs.test }}
          CI_DOCKER: ${{ steps.ci.outputs.docker }}
        run: |
          NEEDS_JSON="$NEEDS_JSON" LOGINS="$LOGINS" CI_LINT="$CI_LINT" CI_TEST="$CI_TEST" CI_DOCKER="$CI_DOCKER" python3 - << 'PY'
          import json, os
          needs=json.loads(os.environ["NEEDS_JSON"])
          logins=os.environ["LOGINS"]
          ci = {"lint": os.environ["CI_LINT"], "test": os.environ["CI_TEST"], "docker": os.environ["CI_DOCKER"]}
          repo="${{ github.repository }}"; sha="${{ github.sha }}"[:7]; actor="${{ github.actor }}"
          run_url=f"https://github.com/{repo}/actions/runs/${{ github.run_id }}"
          # normalize
          def norm(v): return "success" if v=="success" else "failure" if v=="failure" else "skipped" if v in ["skipped","cancelled"] else v
          ci = {k: norm(v) for k,v in ci.items()}
          cd = {k: norm(v.get("result","skipped")) for k,v in needs.items()}
          # combined failed check
          failed_ci=[k for k,v in ci.items() if v=="failure"]
          failed_cd=[k for k,v in cd.items() if v=="failure"]
          failed=failed_ci+failed_cd
          cancelled=[k for k,v in {**ci,**cd}.items() if v=="cancelled"] or [k for k,v in needs.items() if v.get("result")=="cancelled"]
          is_failure=len(failed)>0
          is_success=not is_failure and not cancelled
          def icon(s): return "✅" if s=="success" else "❌" if s=="failure" else "⏭️" if s=="skipped" else "⚠️"
          # table
          table=f"| CI lint | {icon(ci['lint'])} {ci['lint']} |\n| CI test | {icon(ci['test'])} {ci['test']} |\n| CI docker | {icon(ci['docker'])} {ci['docker']} |\n| Staging build | {icon(cd.get('publish-staging','skipped'))} {cd.get('publish-staging','skipped')} |\n| Staging deploy | {icon(cd.get('deploy-staging','skipped'))} {cd.get('deploy-staging','skipped')} |"
          # mermaid with highlight
          def style(n, s): return f"  {n}:::fail" if s=="failure" else f"  {n}"
          mermaid="```mermaid\nflowchart LR\n  lint-->test-->docker-->staging_build-->staging_deploy\n"
          mermaid+=f"  lint[{icon(ci['lint'])} lint]\n  test[{icon(ci['test'])} test]\n  docker[{icon(ci['docker'])} docker]\n  staging_build[{icon(cd.get('publish-staging','skipped'))} build]\n  staging_deploy[{icon(cd.get('deploy-staging','skipped'))} deploy]\n"
          mermaid+="  classDef fail fill:#ffcccc,stroke:#cc0000\n```"
          causes=[]
          if "lint" in failed_ci: causes.append("• CI lint: `ruff check` failed — fix formatting")
          if "test" in failed_ci: causes.append("• CI test: `pytest` failed — check app.py")
          if "docker" in failed_ci: causes.append("• CI docker: build/health failed")
          if "publish-staging" in failed_cd: causes.append("• Staging build: Docker push/smoke `curl /health` failed")
          if "deploy-staging" in failed_cd: causes.append("• Staging deploy: SSH `STAGING_HOST` healthcheck failed")
          if not causes and is_failure: causes.append("• Unknown failure — check Run logs")
          subject=f"[Staging] {'❌ Failure' if is_failure else '✅ Success'} {sha} by {actor} — {','.join(failed) if failed else 'CI+Staging OK'}"
          body=f"### {'❌ Staging Failed' if is_failure else '✅ Staging Passed'} — `{sha}` by @{actor}\n"
          body+=f"**Run:** [#{os.environ.get('GITHUB_RUN_ID','')}]" f"({run_url}) | **Commit:** `{sha}`\n\n"
          body+=f"| Stage | Status |\n|-------|--------|\n{table}\n\n{mermaid}\n"
          if causes: body+="\n**Causes:**\n"+"\n".join(causes)+"\n"
          body+=f"\nCC: {', '.join('@'+l for l in logins.split(',') if l)}\n"
          body+="\n---\n*One email for CI+CD staging — GitHub Issue triggers email to reviewers/assignees.*\n"
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"is_failure={'true' if is_failure else 'false'}\nsubject={subject}\nbody<<__B__\n{body}\n__B__\n")
          PY

      - name: Create GitHub Issue — Staging Failure (triggers Email)
        if: steps.msg.outputs.is_failure == 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        with:
          script: |
            const logins=(process.env.LOGINS||'').split(',').filter(Boolean).slice(0,10);
            let body=process.env.BODY+`\n\nCC: ${logins.map(l=>'@'+l).join(' ')}`;
            try{ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins, labels:['staging-failure','notify']}); core.info('Created staging failure issue'); }catch(e){ core.warning(e.message); await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins}); }

      - name: Log staging success — no email (Failure + prod success)
        if: steps.msg.outputs.is_failure == 'false'
        run: |
          echo "::notice::Staging passed — no email (per Failure + prod success policy)"
          echo "${{ steps.msg.outputs.body }}"

  notify-production:
    runs-on: ubuntu-latest
    needs: [publish-production, deploy-production]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let logins = [];
            try {
              const env = await github.rest.repos.getEnvironment({
                owner: context.repo.owner, repo: context.repo.repo, environment_name: 'production'
              });
              for (const r of (env.data.protection_rules || [])) for (const rev of (r.reviewers || [])) {
                const v = rev.reviewer; if (v?.login) logins.push(v.login);
                else if (v?.slug) { try { const ms = await github.rest.teams.listMembersInOrg({ org: context.repo.owner, team_slug: v.slug }); ms.data.forEach(m => logins.push(m.login)); } catch(e){ logins.push(v.slug); } }
              }
            } catch(e) { core.warning(e.message); }
            if (!logins.length) logins = [context.repo.owner];
            logins = [...new Set(logins)];
            core.setOutput('logins', logins.join(','));

      - name: Build minimal production message
        id: msg
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        run: |
          NEEDS_JSON="$NEEDS_JSON" LOGINS="$LOGINS" python3 - << 'PY'
          import json, os
          needs=json.loads(os.environ["NEEDS_JSON"])
          logins=os.environ["LOGINS"]
          repo="${{ github.repository }}"; sha="${{ github.sha }}"[:7]; actor="${{ github.actor }}"; run_url=f"https://github.com/{repo}/actions/runs/${{ github.run_id }}"
          def norm(v): return "success" if v=="success" else "failure" if v=="failure" else "skipped" if v in ["skipped","cancelled"] else v
          cd={k: norm(v.get("result","skipped")) for k,v in needs.items()}
          failed=[k for k,v in cd.items() if v=="failure"]
          cancelled=[k for k,v in needs.items() if v.get("result")=="cancelled"]
          is_failure=len(failed)>0
          is_cancelled=len(cancelled)>0 and not is_failure
          is_success=not is_failure and not is_cancelled
          def icon(s): return "✅" if s=="success" else "❌" if s=="failure" else "⏭️" if s=="skipped" else "⚠️"
          table=f"| Prod promote | {icon(cd.get('publish-production','skipped'))} {cd.get('publish-production','skipped')} |\n| Prod deploy | {icon(cd.get('deploy-production','skipped'))} {cd.get('deploy-production','skipped')} |"
          mermaid="```mermaid\nflowchart LR\n  promote-->deploy\n  promote["+icon(cd.get('publish-production','skipped'))+" promote]\n  deploy["+icon(cd.get('deploy-production','skipped'))+" deploy]\n```"
          causes=[]
          if "publish-production" in failed: causes.append("• Prod promote: stale guard or imagetools failed — approve latest")
          if "deploy-production" in failed: causes.append("• Prod deploy: SSH `PROD_HOST` healthcheck failed")
          if cancelled: causes.append(f"• Cancelled stale: {', '.join([k for k,v in needs.items() if v.get('result')=='cancelled'])}")
          digest=needs.get("publish-production",{}).get("outputs",{}).get("digest","") or "n/a"
          # try get digest from staging run if available via API? fallback n/a
          subject=f"[Prod] {'❌ Failure' if is_failure else ('⚠️ Cancelled' if is_cancelled else '✅ Success')} {sha} by {actor} — {','.join(failed) if failed else 'production deployed'}"
          body=f"### {'❌ Prod Failed' if is_failure else ('⚠️ Prod Cancelled' if is_cancelled else '✅ Production Deployed')} — `{sha}` by @{actor}\n"
          body+=f"**Run:** [#{os.environ.get('GITHUB_RUN_ID','')}]" f"({run_url}) | **Commit:** `{sha}`\n\n"
          body+=f"| Stage | Status |\n|-------|--------|\n{table}\n\n{mermaid}\n"
          if causes: body+="\n**Causes:**\n"+"\n".join(causes)+"\n"
          if is_success:
              body+=f"\n**Digest:** `{digest}`\n**Images:** `ghcr.io/...:staging` → `:latest/:stable`\n"
              body+=f"**Rollback:** `docker buildx imagetools create --tag ghcr.io/{repo}:latest ghcr.io/{repo}@<digest>`\n"
          body+=f"\nCC: {', '.join('@'+l for l in logins.split(',') if l)}\n"
          body+="\n---\n*After approval — GitHub Issue triggers email to reviewers.*\n"
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"is_failure={'true' if is_failure else 'false'}\nis_cancelled={'true' if is_cancelled else 'false'}\nis_success={'true' if is_success else 'false'}\nsubject={subject}\nbody<<__B__\n{body}\n__B__\n")
          PY

      - name: Create GitHub Issue — Prod Failure
        if: steps.msg.outputs.is_failure == 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        with:
          script: |
            const logins=(process.env.LOGINS||'').split(',').filter(Boolean).slice(0,10);
            let body=process.env.BODY+`\n\nCC: ${logins.map(l=>'@'+l).join(' ')}`;
            try{ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins, labels:['prod-failure','notify']}); }catch(e){ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins}); }

      - name: Create GitHub Issue — Prod Success Ack (auto-closed)
        if: steps.msg.outputs.is_success == 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        with:
          script: |
            const logins=(process.env.LOGINS||'').split(',').filter(Boolean).slice(0,10);
            let body=process.env.BODY+`\n\nCC: ${logins.map(l=>'@'+l).join(' ')}`;
            const labels=['prod-success','notify'];
            try{
              const {data}=await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins, labels});
              await github.rest.issues.update({owner:context.repo.owner, repo:context.repo.repo, issue_number:data.number, state:'closed'});
              core.info('Created prod success issue #'+data.number+' (closed, email sent)');
            }catch(e){ core.warning(e.message); const {data}=await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins}); await github.rest.issues.update({owner:context.repo.owner, repo:context.repo.repo, issue_number:data.number, state:'closed'}); }

      - name: Log prod cancelled
        if: steps.msg.outputs.is_cancelled == 'true'
        run: |
          echo "::notice::Prod cancelled (stale) — no email"
          echo "${{ steps.msg.outputs.body }}"
