name: CD Pipeline

# ============================================================================
# CD Pipeline — Optimized Flow with 2-Stage Notifications & Deferred Approval
# ============================================================================
# Flow:
#   1. publish-staging    : Build & push :staging + local smoke test (no approval, staging env)
#   2. deploy-staging     : SSH deploy to staging (staging env)
#   3. publish-production : Promote already-tested staging digest to :latest/:stable
#                           via immutable `docker buildx imagetools create` (NO rebuild, NO approval)
#                           — keeps digest promotion, runs automatically after staging validated.
#   4. notify-preproduction (Email 1): CI + staging + production image published
#                           + "Production deployment is waiting for approval"
#                           Depends on: publish-staging, deploy-staging, publish-production
#   5. deploy-production  : SSH deploy to production (protected `production` environment)
#                           -> Approval happens HERE before actual production deployment.
#                           Concurrency `production` auto-cancels stale waiting runs on new push.
#   6. notify-production (Email 2): Production deployment result (success/failure) after approval
#                           Depends only on: deploy-production
#
# Exactly 2 custom notification emails (via GitHub Issue -> email). No duplicates.
# Generic, clean, scalable: uses github.repository + secrets, no hard-coded env values.
# Immutable digest promotion retained (no rebuild of production image).
# ============================================================================

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-staging:
    runs-on: ubuntu-latest
    concurrency:
      group: staging-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: staging
      url: https://ghcr.io/${{ github.repository }}:staging
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (staging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - name: Build and push to GHCR (staging) — single build
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Show staging image
        run: |
          echo "Staging pushed: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Use this digest to promote to production or rollback"

      - name: Deploy and test staging artifact
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}:staging" | tr '[:upper:]' '[:lower:]')
          echo "Pulling staging image $IMAGE"
          docker pull "$IMAGE"
          echo "Running staging container"
          docker run -d -p 5000:5000 --name staging-test "$IMAGE"
          echo "Waiting for app to be ready..."
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5000/health; then
              echo "Staging health OK"
              break
            fi
            echo "Attempt $i/15 failed, retrying in 1s..."
            if [ "$i" -eq 15 ]; then
              echo "Staging failed to start"
              docker logs staging-test
              docker rm -f staging-test || true
              exit 1
            fi
            sleep 1
          done
          curl --fail http://localhost:5000/ || (docker logs staging-test && exit 1)
          echo "Staging smoke tests passed"
          docker logs staging-test || true
          docker rm -f staging-test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: publish-staging
    concurrency:
      group: staging-deploy-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: staging
      # url must not use secrets (GH Actions forbids secrets in environment.url) — use static GHCR url
      url: https://ghcr.io/${{ github.repository }}:staging
    steps:
      - name: Check STAGING_HOST configured
        run: |
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "::error::STAGING_HOST not set — deployment requires STAGING_HOST secret"
            exit 1
          fi

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          password: ${{ secrets.STAGING_PASSWORD || secrets.STAGING_SSH_PASSWORD }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}:staging" | tr '[:upper:]' '[:lower:]')
            # Fix docker permission denied — ibrahem not in docker group, sudo needs STAGING_PASSWORD
            SUDO_PASS="${{ secrets.STAGING_PASSWORD || secrets.STAGING_SSH_PASSWORD }}"
            if [ -n "$SUDO_PASS" ]; then echo "$SUDO_PASS" | sudo -S -v >/dev/null 2>&1 || true; fi
            if docker ps >/dev/null 2>&1; then
              DOCKER="docker"
              COMPOSE="docker compose"
            elif sudo -n docker ps >/dev/null 2>&1; then
              echo "Docker needs sudo for $USER — using sudo"
              DOCKER="sudo docker"
              COMPOSE="sudo docker compose"
              sudo -n usermod -aG docker $USER 2>/dev/null || echo "$SUDO_PASS" | sudo -S usermod -aG docker $USER 2>/dev/null || true
              sudo -n chmod 666 /var/run/docker.sock 2>/dev/null || echo "$SUDO_PASS" | sudo -S chmod 666 /var/run/docker.sock 2>/dev/null || true
            else
              echo "::error::Docker not accessible (even with sudo). Install docker: see SETUP_STEPS.md#1"
              docker ps 2>&1 || true
              if [ -n "$SUDO_PASS" ]; then echo "$SUDO_PASS" | sudo -S docker ps 2>&1 || true; else sudo docker ps 2>&1 || true; fi
              exit 1
            fi
            echo "Using: $DOCKER ($($DOCKER --version 2>&1 | head -1)), $($COMPOSE version 2>&1 | head -1)"
            echo "Logging into GHCR"
            # Prefer GHCR_PAT (persistent), fallback to GITHUB_TOKEN
            TOKEN="${{ secrets.GHCR_PAT }}"
            if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
            echo "$TOKEN" | $DOCKER login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "Pulling $IMAGE"
            $DOCKER pull "$IMAGE"
            # Port/Path from secrets or variables (generic, same-server needs different ports/paths)
            STAGING_PORT="${{ secrets.STAGING_PORT || vars.STAGING_PORT || 5000 }}"
            STAGING_PATH="${{ secrets.STAGING_PATH || vars.STAGING_PATH || '/opt/ci-cd-pipeline' }}"
            [ -z "$STAGING_PATH" ] && STAGING_PATH="/opt/ci-cd-pipeline"
            [ -z "$STAGING_PORT" ] && STAGING_PORT="5000"
            echo "Staging config: STAGING_PORT=$STAGING_PORT STAGING_PATH=$STAGING_PATH"
            mkdir -p "$STAGING_PATH" 2>/dev/null || ( [ -n "$SUDO_PASS" ] && echo "$SUDO_PASS" | sudo -S mkdir -p "$STAGING_PATH" && echo "$SUDO_PASS" | sudo -S chown $USER:$USER "$STAGING_PATH" )
            cd "$STAGING_PATH"
            echo "Staging path: $(pwd) (STAGING_PATH=$STAGING_PATH) contents:"
            ls -la | head -30 || true
            if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ]; then
              echo "docker-compose.yml missing in $STAGING_PATH — creating template (port $STAGING_PORT for generic same-server)"
              printf '%s\n' 'services:' '  app:' '    image: ghcr.io/ibrahim-samir-makkook-ai/ci-cd-pipeline:${TAG:-staging}' "    ports: [\"$STAGING_PORT:5000\"]" '    container_name: ci-cd-pipeline-test' '    restart: unless-stopped' '    healthcheck:' '      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('\''http://localhost:5000/health'\'')"]' '      interval: 10s' '      timeout: 3s' '      retries: 3' '      start_period: 5s' > docker-compose.yml
              echo "Created docker-compose.yml:"
              cat docker-compose.yml
            else
              # Patch existing compose for same-server migration (ensure host port matches STAGING_PORT)
              if grep -q 'ports:' docker-compose.yml && ! grep -q "\"$STAGING_PORT:5000\"" docker-compose.yml; then
                echo "Patching existing docker-compose.yml host port to $STAGING_PORT"
                sed -i -E "s/\"[0-9]+:5000\"/\"$STAGING_PORT:5000\"/g" docker-compose.yml || true
                cat docker-compose.yml
              fi
            fi
            $COMPOSE config >/dev/null && echo "compose valid" || (echo "::error::compose invalid"; cat docker-compose.yml || true; exit 1)
            echo "Deploying with docker compose (cleaning stale port $STAGING_PORT)"
            # Clean previous compose project and orphan ci-cd-pipeline-test (fixes Bind 0.0.0.0:$STAGING_PORT failed: port is already allocated)
            TAG=staging $COMPOSE down 2>/dev/null || true
            $DOCKER rm -f ci-cd-pipeline-test 2>/dev/null || echo "$SUDO_PASS" | sudo -S docker rm -f ci-cd-pipeline-test 2>/dev/null || true
            $DOCKER ps -q --filter publish=$STAGING_PORT | xargs -r $DOCKER rm -f 2>/dev/null || $DOCKER ps -q --filter publish=$STAGING_PORT | xargs -r echo "$SUDO_PASS" | sudo -S docker rm -f 2>/dev/null || true
            echo "$SUDO_PASS" | sudo -S fuser -k $STAGING_PORT/tcp 2>/dev/null || sudo -n fuser -k $STAGING_PORT/tcp 2>/dev/null || true
            TAG=staging $COMPOSE pull
            TAG=staging $COMPOSE up -d --remove-orphans
            echo "Waiting for /health on $STAGING_PORT..."
            for i in $(seq 1 15); do
              if curl --fail http://localhost:$STAGING_PORT/health; then echo "Staging health OK"; break; fi
              echo "attempt $i/15 failed, retrying in 2s..."
              if [ "$i" -eq 15 ]; then echo "Healthcheck failed"; $COMPOSE logs --tail 100 || $DOCKER ps -a | head -20; exit 1; fi
              sleep 2
            done
            curl --fail http://localhost:$STAGING_PORT/ | head -c 300; echo
            echo "Staging deploy complete — digest ${{ needs.publish-staging.outputs.digest }}"
            $COMPOSE ps || $DOCKER ps | head -20

  publish-production:
    # --------------------------------------------------------------
    # Production image publish — NO approval required here.
    # Promotes the already-tested staging digest to production tags
    # (latest/stable) via immutable digest promotion (no rebuild).
    # Runs automatically after staging is validated (publish-staging + deploy-staging).
    # Approval is deferred to deploy-production (protected `production` env).
    # Concurrency `production` ensures stale runs auto-cancel on new push,
    # keeping digest promotion consistent with the latest commit.
    # --------------------------------------------------------------
    runs-on: ubuntu-latest
    needs: [publish-staging, deploy-staging]
    concurrency:
      group: production
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ needs.publish-staging.outputs.digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (production)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=stable
          flavor: |
            latest=false
          # Decision: semver canceled, SBOM/provenance disabled for minimal GHCR-only.
          # Staging validates artifact; production reuses same digest via imagetools.
          # SHA tag already exists from staging (same digest) — not recreated here.

      - name: Guard against stale promotion
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          EXPECTED="${{ needs.publish-staging.outputs.digest }}"
          if [ -z "$EXPECTED" ]; then
            echo "::error::Stale check failed: expected digest empty"
            exit 1
          fi
          SRC="${IMAGE}@${EXPECTED}"
          echo "Expected digest from staging: $EXPECTED"
          # Fetch current staging digest from GHCR (explicit stale check beyond concurrency)
          # Prefer crane if available, fallback to imagetools inspect
          if command -v crane >/dev/null 2>&1; then
            CURRENT=$(crane digest "${IMAGE}:staging" 2>/dev/null || true)
          else
            # Try imagetools inspect --raw with jq
            RAW=$(docker buildx imagetools inspect "${IMAGE}:staging" --raw 2>/dev/null || true)
            if echo "$RAW" | grep -q '"digest"'; then
              CURRENT=$(echo "$RAW" | jq -r '.manifests[0].digest // .config.digest // empty' 2>/dev/null || true)
            fi
            if [ -z "$CURRENT" ]; then
              CURRENT=$(docker buildx imagetools inspect "${IMAGE}:staging" 2>&1 | grep -o 'sha256:[a-f0-9]\{64\}' | head -1 || true)
            fi
          fi
          echo "Current staging digest in registry: ${CURRENT:-<unknown>}"
          if [ -n "$CURRENT" ] && [ "$EXPECTED" != "$CURRENT" ]; then
            echo "::warning::Stale promotion: staging is now $CURRENT but this run built $EXPECTED"
            echo "::notice::A newer push exists — this promotion will still use THIS run's digest ($EXPECTED), not the newest staging. Prefer approving the latest run if you want the latest code."
            # Do NOT block — allow promoting the run's own digest (digest is immutable). Remove 'exit 1' to fix stale error.
          else
            echo "Stale check passed — promoting $SRC"
          fi
          # Verify source digest still exists in registry
          docker buildx imagetools inspect "$SRC" || (echo "::error::Source $SRC not found" && exit 1)

      - name: Promote staging digest to production (imagetools, no rebuild)
        run: |
          set -e
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DIGEST="${{ needs.publish-staging.outputs.digest }}"
          SRC="${IMAGE}@${DIGEST}"
          echo "Source (staging digest): $SRC"
          echo "Production tags: ${{ steps.meta.outputs.tags }}"
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating tag: $TAG -> $SRC"
            docker buildx imagetools create --tag "$TAG" "$SRC"
          done
          echo "Production image published (no approval required here) — promotion complete via immutable digest"
          docker buildx imagetools inspect "${IMAGE}:latest" || true
          docker buildx imagetools inspect "${IMAGE}:stable" || true

      - name: Summary
        run: |
          echo "### CD Production Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Tags: \`${{ steps.meta.outputs.tags }}\`" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "Source digest: \`${{ needs.publish-staging.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: awaiting manual approval for production deployment (deploy-production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rollback with digest (immutable):" >> $GITHUB_STEP_SUMMARY
          echo "\`docker buildx imagetools create --tag ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}@sha256:<digest>\`" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    # --------------------------------------------------------------
    # Production deployment — REQUIRES manual approval via protected
    # `production` environment. Reviewer configured in:
    #   Settings > Environments > production > Required reviewers
    # This job waits for approval before any SSH deploy happens.
    # Concurrency `production` ensures stale waiting runs auto-cancel
    # on new push (cancel-in-progress: true).
    # --------------------------------------------------------------
    runs-on: ubuntu-latest
    needs: publish-production
    concurrency:
      group: production
      cancel-in-progress: true
    environment:
      name: production
      url: https://ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Check PROD_HOST configured
        run: |
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "::error::PROD_HOST not set — deployment requires PROD_HOST secret"
            exit 1
          fi

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          password: ${{ secrets.PROD_PASSWORD || secrets.PROD_SSH_PASSWORD || secrets.STAGING_PASSWORD }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            IMAGE=$(echo "ghcr.io/${{ github.repository }}:stable" | tr '[:upper:]' '[:lower:]')
            # Fix docker permission denied — sudo needs PROD_PASSWORD/STAGING_PASSWORD
            SUDO_PASS="${{ secrets.PROD_PASSWORD || secrets.PROD_SSH_PASSWORD || secrets.STAGING_PASSWORD }}"
            if [ -n "$SUDO_PASS" ]; then echo "$SUDO_PASS" | sudo -S -v >/dev/null 2>&1 || true; fi
            if docker ps >/dev/null 2>&1; then
              DOCKER="docker"
              COMPOSE="docker compose"
            elif sudo -n docker ps >/dev/null 2>&1; then
              echo "Docker needs sudo for $USER — using sudo"
              DOCKER="sudo docker"
              COMPOSE="sudo docker compose"
              sudo -n usermod -aG docker $USER 2>/dev/null || echo "$SUDO_PASS" | sudo -S usermod -aG docker $USER 2>/dev/null || true
              sudo -n chmod 666 /var/run/docker.sock 2>/dev/null || echo "$SUDO_PASS" | sudo -S chmod 666 /var/run/docker.sock 2>/dev/null || true
            else
              echo "::error::Docker not accessible (even with sudo). Install docker: see SETUP_STEPS.md#1"
              docker ps 2>&1 || true
              if [ -n "$SUDO_PASS" ]; then echo "$SUDO_PASS" | sudo -S docker ps 2>&1 || true; else sudo docker ps 2>&1 || true; fi
              exit 1
            fi
            echo "Using: $DOCKER ($($DOCKER --version 2>&1 | head -1)), $($COMPOSE version 2>&1 | head -1)"
            echo "Logging into GHCR"
            TOKEN="${{ secrets.GHCR_PAT }}"
            if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
            echo "$TOKEN" | $DOCKER login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "Pulling $IMAGE"
            $DOCKER pull "$IMAGE"
            # Port/Path from secrets or variables (generic, same-server needs different ports/paths)
            PROD_PORT="${{ secrets.PROD_PORT || vars.PROD_PORT || 5001 }}"
            PROD_PATH="${{ secrets.PROD_PATH || vars.PROD_PATH || '/opt/ci-cd-pipeline-prod' }}"
            [ -z "$PROD_PATH" ] && PROD_PATH="/opt/ci-cd-pipeline-prod"
            [ -z "$PROD_PORT" ] && PROD_PORT="5001"
            echo "Prod config: PROD_PORT=$PROD_PORT PROD_PATH=$PROD_PATH"
            mkdir -p "$PROD_PATH" 2>/dev/null || ( [ -n "$SUDO_PASS" ] && echo "$SUDO_PASS" | sudo -S mkdir -p "$PROD_PATH" && echo "$SUDO_PASS" | sudo -S chown $USER:$USER "$PROD_PATH" )
            cd "$PROD_PATH"
            echo "Prod path: $(pwd) (PROD_PATH=$PROD_PATH) contents:"
            ls -la | head -30 || true
            if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ] && [ ! -f compose.yaml ]; then
              echo "docker-compose.yml missing in $PROD_PATH — creating template (prod on $PROD_PORT for same-server)"
              printf '%s\n' 'services:' '  app:' '    image: ghcr.io/ibrahim-samir-makkook-ai/ci-cd-pipeline:${TAG:-stable}' "    ports: [\"$PROD_PORT:5000\"]" '    container_name: ci-cd-pipeline-prod' '    restart: unless-stopped' '    healthcheck:' '      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('\''http://localhost:5000/health'\'')"]' '      interval: 10s' '      timeout: 3s' '      retries: 3' '      start_period: 5s' > docker-compose.yml
              echo "Created docker-compose.yml:"
              cat docker-compose.yml
            else
              # Patch existing compose for same-server migration (ensure host port/container_name match prod)
              if grep -q 'ports:' docker-compose.yml && ! grep -q "\"$PROD_PORT:5000\"" docker-compose.yml; then
                echo "Patching existing docker-compose.yml host port to $PROD_PORT"
                sed -i -E "s/\"[0-9]+:5000\"/\"$PROD_PORT:5000\"/g" docker-compose.yml || true
                cat docker-compose.yml
              fi
              if ! grep -q "container_name: ci-cd-pipeline-prod" docker-compose.yml; then
                echo "Patching container_name to ci-cd-pipeline-prod"
                sed -i "s/container_name: ci-cd-pipeline-test/container_name: ci-cd-pipeline-prod/g" docker-compose.yml || true
                sed -i "s/container_name: ci-cd-pipeline-staging/container_name: ci-cd-pipeline-prod/g" docker-compose.yml || true
                cat docker-compose.yml
              fi
            fi
            echo "Using compose file:"
            cat docker-compose.yml
            $COMPOSE config >/dev/null && echo "compose valid" || (echo "::error::compose invalid"; cat docker-compose.yml || true; exit 1)
            echo "Deploying production with docker compose (cleaning stale port $PROD_PORT)"
            TAG=stable $COMPOSE down 2>/dev/null || true
            $DOCKER rm -f ci-cd-pipeline-prod 2>/dev/null || echo "$SUDO_PASS" | sudo -S docker rm -f ci-cd-pipeline-prod 2>/dev/null || true
            $DOCKER ps -q --filter publish=$PROD_PORT | xargs -r $DOCKER rm -f 2>/dev/null || $DOCKER ps -q --filter publish=$PROD_PORT | xargs -r echo "$SUDO_PASS" | sudo -S docker rm -f 2>/dev/null || true
            echo "$SUDO_PASS" | sudo -S fuser -k $PROD_PORT/tcp 2>/dev/null || sudo -n fuser -k $PROD_PORT/tcp 2>/dev/null || true
            TAG=stable $COMPOSE pull
            TAG=stable $COMPOSE up -d --remove-orphans
            echo "Waiting for /health on $PROD_PORT..."
            for i in $(seq 1 15); do
              if curl --fail http://localhost:$PROD_PORT/health; then echo "Production health OK"; break; fi
              echo "attempt $i/15 failed, retrying in 2s..."
              if [ "$i" -eq 15 ]; then echo "Healthcheck failed"; $COMPOSE logs --tail 100 || $DOCKER ps -a | head -20; exit 1; fi
              sleep 2
            done
            curl --fail http://localhost:$PROD_PORT/ | head -c 300; echo
            echo "Production deploy complete on $PROD_PORT"
            $COMPOSE ps || $DOCKER ps | head -20

  notify-preproduction:
    # --------------------------------------------------------------
    # Email 1 — Pre-Production Summary (exactly 1 of 2 custom emails)
    # Triggers AFTER: CI + staging build/deploy + production image published.
    # Indicates that production deployment is WAITING for manual approval.
    # Depends on: publish-staging, deploy-staging, publish-production
    # Runs with `if: always()` to report success OR failure; suppresses
    # duplicate emails by replacing the old notify-staging job.
    # --------------------------------------------------------------
    runs-on: ubuntu-latest
    needs: [publish-staging, deploy-staging, publish-production]
    if: always()
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Resolve reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let logins = [];
            try {
              const env = await github.rest.repos.getEnvironment({
                owner: context.repo.owner, repo: context.repo.repo, environment_name: 'production'
              });
              for (const r of (env.data.protection_rules || [])) for (const rev of (r.reviewers || [])) {
                const v = rev.reviewer; if (v?.login) logins.push(v.login);
                else if (v?.slug) { try { const ms = await github.rest.teams.listMembersInOrg({ org: context.repo.owner, team_slug: v.slug }); ms.data.forEach(m => logins.push(m.login)); } catch(e){ logins.push(v.slug); } }
              }
            } catch(e) { core.warning(e.message); }
            if (!logins.length) logins = [context.repo.owner];
            logins = [...new Set(logins)];
            core.setOutput('logins', logins.join(','));

      - name: Fetch CI status (for combined CI+CD preproduction email)
        id: ci
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let ci = { lint: 'skipped', test: 'skipped', docker: 'skipped' };
            let found = false;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner, repo: context.repo.repo,
                  workflow_id: 'ci.yml', per_page: 10
                });
                const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha);
                if (run) {
                  core.info(`Found CI run ${run.id} attempt ${attempt} conclusion=${run.conclusion} status=${run.status}`);
                  const jobs = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 20
                  });
                  for (const j of jobs.data.jobs) {
                    const n = j.name.toLowerCase();
                    if (n.includes('lint')) ci.lint = j.conclusion || j.status;
                    else if (n.includes('test')) ci.test = j.conclusion || j.status;
                    else if (n.includes('docker')) ci.docker = j.conclusion || j.status;
                  }
                  found = true;
                  break;
                } else {
                  core.warning(`CI run not found for sha ${context.sha} attempt ${attempt}/3`);
                  if (attempt < 3) await new Promise(r => setTimeout(r, 10000));
                }
              } catch(e) { core.warning('CI fetch failed attempt ' + attempt + ': ' + e.message); if (attempt < 3) await new Promise(r => setTimeout(r, 10000)); }
            }
            core.setOutput('lint', ci.lint);
            core.setOutput('test', ci.test);
            core.setOutput('docker', ci.docker);
            core.setOutput('found', String(found));
            core.info(`CI: ${JSON.stringify(ci)} found=${found}`);

      - name: Build preproduction message (CI + staging + prod publish + awaiting approval)
        id: msg
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
          CI_LINT: ${{ steps.ci.outputs.lint }}
          CI_TEST: ${{ steps.ci.outputs.test }}
          CI_DOCKER: ${{ steps.ci.outputs.docker }}
          DIGEST: ${{ needs.publish-staging.outputs.digest }}
        run: |
          NEEDS_JSON="$NEEDS_JSON" LOGINS="$LOGINS" CI_LINT="$CI_LINT" CI_TEST="$CI_TEST" CI_DOCKER="$CI_DOCKER" DIGEST="$DIGEST" python3 - << 'PY'
          import json, os
          needs=json.loads(os.environ["NEEDS_JSON"])
          ci = {"lint": os.environ["CI_LINT"], "test": os.environ["CI_TEST"], "docker": os.environ["CI_DOCKER"]}
          digest = os.environ.get("DIGEST","")
          repo="${{ github.repository }}"; sha="${{ github.sha }}"[:7]; actor="${{ github.actor }}"
          run_url=f"https://github.com/{repo}/actions/runs/${{ github.run_id }}"
          def norm(v): return "success" if v=="success" else "failure" if v=="failure" else "cancelled" if v=="cancelled" else "skipped" if v in ["skipped","cancelled"] else v
          ci = {k: norm(v) for k,v in ci.items()}
          cd = {k: norm(v.get("result","skipped")) for k,v in needs.items()}
          failed_ci=[k for k,v in ci.items() if v=="failure"]
          failed_cd=[k for k,v in cd.items() if v=="failure"]
          failed=failed_ci+failed_cd
          cancelled=[k for k,v in {**ci,**cd}.items() if v=="cancelled"] or [k for k,v in needs.items() if v.get("result")=="cancelled"]
          is_failure=len(failed)>0
          is_cancelled=len(cancelled)>0 and not is_failure
          is_success=not is_failure and not is_cancelled
          def icon(s): return "✅" if s=="success" else "❌" if s=="failure" else "⏭️" if s=="skipped" else "⚠️" if s=="cancelled" else "⚠️"
          table=f"| CI lint | {icon(ci['lint'])} {ci['lint']} |\n| CI test | {icon(ci['test'])} {ci['test']} |\n| CI docker | {icon(ci['docker'])} {ci['docker']} |\n| Staging build | {icon(cd.get('publish-staging','skipped'))} {cd.get('publish-staging','skipped')} |\n| Staging deploy | {icon(cd.get('deploy-staging','skipped'))} {cd.get('deploy-staging','skipped')} |\n| Production image (publish) | {icon(cd.get('publish-production','skipped'))} {cd.get('publish-production','skipped')} |"
          if digest:
            digest_line=f"\n**Digest:** `{digest}` — immutable promotion via `imagetools create` (no rebuild)\n"
          else:
            digest_line=""
          subject="staging deployment"
          if is_cancelled:
              body=f"### ⚠️ Pre-Production Cancelled — `{sha}` by @{actor}\n"
              body+=f"\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n{digest_line}\n\n_No email for cancelled (stale) runs._\n"
          elif is_failure:
              body=f"### ❌ Pre-Production Failed — `{sha}` by @{actor}\n"
              body+=f"\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n{digest_line}\n\n**Failed stages:** `{', '.join(failed)}` — fix and push again. Production deployment **not** awaiting approval.\n"
          else:
              body=f"### ✅ Pre-Production Passed — `{sha}` by @{actor}\n"
              body+=f"\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n{digest_line}\n\n🚦 **Production deployment is waiting for approval**\n"
              body+=f"Production image (`{repo}:latest` / `:stable`) has been published from the tested staging digest via immutable promotion.\n"
              body+=f"Reviewer, please approve the **deploy-production** job in the [Actions run]({run_url}) (protected `production` environment) to deploy to production.\n"
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"is_failure={'true' if is_failure else 'false'}\nis_success={'true' if is_success else 'false'}\nis_cancelled={'true' if is_cancelled else 'false'}\nsubject={subject}\nbody<<__B__\n{body}\n__B__\n")
          PY

      - name: Create GitHub Issue (triggers Email 1 — preproduction)
        if: steps.msg.outputs.is_cancelled != 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
          IS_FAILURE: ${{ steps.msg.outputs.is_failure }}
        with:
          script: |
            const logins=(process.env.LOGINS||'').split(',').filter(Boolean).slice(0,10);
            let body=process.env.BODY;
            const isFailure = process.env.IS_FAILURE === 'true';
            const labels = isFailure ? ['preprod-failure','notify'] : ['preprod-success','notify'];
            try{ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins, labels}); core.info('Created preproduction issue — Email 1 sent'); }catch(e){ core.warning(e.message); await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins}); }

      - name: Log preproduction cancelled (no email)
        if: steps.msg.outputs.is_cancelled == 'true'
        run: |
          echo "::notice::Preproduction cancelled (stale) — no email"
          echo "${{ steps.msg.outputs.body }}"

  notify-production:
    # --------------------------------------------------------------
    # Email 2 — Production Deployment Result (exactly 1 of 2 custom emails)
    # Triggers ONLY after deploy-production completes (which waited for
    # manual approval via protected `production` environment).
    # Reports success or failure of the actual production deployment.
    # Depends only on: deploy-production
    # Replaces old notify-production that depended on both publish+deploy.
    # --------------------------------------------------------------
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve reviewers
        id: reviewers
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let logins = [];
            try {
              const env = await github.rest.repos.getEnvironment({
                owner: context.repo.owner, repo: context.repo.repo, environment_name: 'production'
              });
              for (const r of (env.data.protection_rules || [])) for (const rev of (r.reviewers || [])) {
                const v = rev.reviewer; if (v?.login) logins.push(v.login);
                else if (v?.slug) { try { const ms = await github.rest.teams.listMembersInOrg({ org: context.repo.owner, team_slug: v.slug }); ms.data.forEach(m => logins.push(m.login)); } catch(e){ logins.push(v.slug); } }
              }
            } catch(e) { core.warning(e.message); }
            if (!logins.length) logins = [context.repo.owner];
            logins = [...new Set(logins)];
            core.setOutput('logins', logins.join(','));

      - name: Build production deployment message
        id: msg
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        run: |
          NEEDS_JSON="$NEEDS_JSON" LOGINS="$LOGINS" python3 - << 'PY'
          import json, os
          needs=json.loads(os.environ["NEEDS_JSON"])
          repo="${{ github.repository }}"; sha="${{ github.sha }}"[:7]; actor="${{ github.actor }}"; run_url=f"https://github.com/{repo}/actions/runs/${{ github.run_id }}"
          def norm(v): return "success" if v=="success" else "failure" if v=="failure" else "cancelled" if v=="cancelled" else "skipped" if v in ["skipped","cancelled"] else v
          cd={k: norm(v.get("result","skipped")) for k,v in needs.items()}
          # Only deploy-production matters here; publish-production already reported in Email 1
          deploy_result = cd.get('deploy-production','skipped')
          raw_result = needs.get('deploy-production',{}).get('result','skipped')
          is_cancelled = raw_result == 'cancelled'
          is_skipped = raw_result in ['skipped']
          is_failure = deploy_result == 'failure'
          is_success = deploy_result == 'success'
          def icon(s): return "✅" if s=="success" else "❌" if s=="failure" else "⏭️" if s=="skipped" else "⚠️" if s=="cancelled" else "⚠️"
          table=f"| Production deploy | {icon(deploy_result)} {deploy_result} |"
          if is_skipped:
            subject="production deployment"
            body=f"### ⏭️ Production Skipped — `{sha}` by @{actor}\n\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n\n_Production deployment was skipped (upstream failure)._ \n"
          elif is_cancelled:
            subject="production deployment"
            body=f"### ⚠️ Production Cancelled — `{sha}` by @{actor}\n\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n"
          elif is_failure:
            subject="production deployment"
            body=f"### ❌ Production Deployment Failed — `{sha}` by @{actor}\n\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n\n_Production deployment failed after approval — check deploy logs and consider rollback via immutable digest._\n"
          else:
            subject="production deployment"
            body=f"### ✅ Production Deployed — `{sha}` by @{actor}\n\n🔗 [View progress]({run_url})\n\n| Stage | Status |\n|-------|--------|\n{table}\n\n🚀 Production is live.\n"
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"is_failure={'true' if is_failure else 'false'}\nis_cancelled={'true' if is_cancelled else 'false'}\nis_skipped={'true' if is_skipped else 'false'}\nis_success={'true' if is_success else 'false'}\nsubject={subject}\nbody<<__B__\n{body}\n__B__\n")
          PY

      - name: Create GitHub Issue (triggers Email 2 — production result)
        if: steps.msg.outputs.is_cancelled != 'true' && steps.msg.outputs.is_skipped != 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
          IS_FAILURE: ${{ steps.msg.outputs.is_failure }}
        with:
          script: |
            const logins=(process.env.LOGINS||'').split(',').filter(Boolean).slice(0,10);
            let body=process.env.BODY;
            const isFailure = process.env.IS_FAILURE === 'true';
            const labels = isFailure ? ['prod-failure','notify'] : ['prod-success','notify'];
            try{ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins, labels}); core.info('Created prod issue — Email 2 sent'); }catch(e){ await github.rest.issues.create({owner:context.repo.owner, repo:context.repo.repo, title:process.env.SUBJECT, body, assignees:logins}); }

      - name: Log prod skipped/cancelled (no email)
        if: steps.msg.outputs.is_cancelled == 'true' || steps.msg.outputs.is_skipped == 'true'
        run: |
          echo "::notice::Prod deployment skipped/cancelled — no email (see body)"
          echo "${{ steps.msg.outputs.body }}"
