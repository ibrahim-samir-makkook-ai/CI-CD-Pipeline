name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Check type annotations with Ruff
        run: ruff check --select ANN .

      - name: Check formatting with Ruff
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-cd-pipeline-test:latest .

      - name: Test Docker image runs
        run: |
          docker run -d -p 5000:5000 --name test-container ci-cd-pipeline-test:latest
          echo "Waiting for app to be ready..."
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5000/health; then
              echo "App is ready!"
              break
            fi
            echo "Attempt $i/15 failed, retrying in 1s..."
            if [ "$i" -eq 15 ]; then
              echo "App failed to start in time"
              docker logs test-container
              exit 1
            fi
            sleep 1
          done
          curl --fail http://localhost:5000/ || (docker logs test-container && exit 1)
          docker stop test-container
          docker rm test-container

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve reviewers (GitHub logins from production environment)
        id: reviewers
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            let logins = [];
            try {
              const env = await github.rest.repos.getEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: 'production'
              });
              const rules = env.data.protection_rules || [];
              for (const r of rules) {
                for (const rev of (r.reviewers || [])) {
                  const v = rev.reviewer;
                  if (v?.login) logins.push(v.login);
                  else if (v?.slug) {
                    try {
                      const ms = await github.rest.teams.listMembersInOrg({ org: context.repo.owner, team_slug: v.slug });
                      ms.data.forEach(m => logins.push(m.login));
                    } catch(e){ core.warning('team expand failed '+v.slug+': '+e.message); logins.push(v.slug); }
                  }
                }
              }
              core.info('Reviewer logins from environment: ' + logins.join(','));
            } catch(e) { core.warning('getEnvironment failed: ' + e.message); }
            if (!logins.length) {
              logins = [context.repo.owner];
              core.info('Fallback to repo owner: ' + logins.join(','));
            }
            logins = [...new Set(logins)];
            core.setOutput('logins', logins.join(','));

      - name: Build subject/body and status (GitHub Email via Issue)
        id: msg
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          REVIEWER_LOGINS: ${{ steps.reviewers.outputs.logins }}
        run: |
          NEEDS_JSON="$NEEDS_JSON" REVIEWER_LOGINS="$REVIEWER_LOGINS" python3 - << 'PY'
          import json, os, pathlib
          needs = json.loads(os.environ.get("NEEDS_JSON","{}"))
          logins = os.environ.get("REVIEWER_LOGINS","")
          repo = "${{ github.repository }}"
          sha = "${{ github.sha }}"[:7]
          full_sha = "${{ github.sha }}"
          actor = "${{ github.actor }}"
          ref = "${{ github.ref }}"
          run_id = "${{ github.run_id }}"
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          failed = [k for k,v in needs.items() if v.get("result")=="failure"]
          cancelled = [k for k,v in needs.items() if v.get("result")=="cancelled"]
          skipped = [k for k,v in needs.items() if v.get("result")=="skipped"]
          causes=[]
          if "lint" in failed:
              causes.append("• lint failed: ruff check / format (ci.yml:27) — style, type ANN, or formatting error")
          if "test" in failed:
              causes.append("• test failed: pytest -v (ci.yml:54) — 5 tests in tests/test_app.py, check app.py logic")
          if "docker" in failed:
              causes.append("• docker failed: docker build or smoke curl /health on runner (ci.yml:67) — Dockerfile or app failed to start")
          if cancelled:
              causes.append(f"• Cancelled: {', '.join(cancelled)} — workflow cancelled")
          if not failed and not cancelled:
              causes.append("All CI jobs succeeded (lint → test → docker).")
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"is_failure={'true' if failed else 'false'}\n")
              f.write(f"is_cancelled={'true' if cancelled and not failed else 'false'}\n")
              f.write(f"is_success={'true' if not failed and not cancelled else 'false'}\n")
              if failed:
                  subject = f"[CI] ❌ Failure {sha} ({ref}) by {actor} — {','.join(failed)}"
              elif cancelled:
                  subject = f"[CI] ⚠️ Cancelled {sha} by {actor}"
              else:
                  subject = f"[CI] ✅ Success {sha} ({ref}) by {actor} — CI passed"
              f.write(f"subject={subject}\n")
              body_lines=[]
              body_lines.append(f"Repository: {repo}")
              body_lines.append(f"Branch/Ref: {ref}")
              body_lines.append(f"Commit: {full_sha} ({sha}) by {actor}")
              body_lines.append(f"Run: {run_url}")
              body_lines.append(f"Reviewers (GitHub): {logins or 'n/a'}")
              body_lines.append(f"CC: {', '.join(['@'+l for l in logins.split(',') if l]) if logins else 'n/a'}")
              body_lines.append(f"Results: {json.dumps({k: v.get('result') for k,v in needs.items()}, indent=2)}")
              body_lines.append("")
              if failed:
                  body_lines.append("Status: ❌ FAILURE — GitHub Email via Issue (assignees receive GitHub email)")
                  body_lines.append(f"Failed: {', '.join(failed)}")
                  if cancelled: body_lines.append(f"Cancelled: {', '.join(cancelled)}")
                  if skipped: body_lines.append(f"Skipped: {', '.join(skipped)}")
                  body_lines.append("")
                  body_lines.append("Issues & Causes:")
                  body_lines.extend(causes)
              elif cancelled:
                  body_lines.append("Status: ⚠️ CANCELLED")
                  body_lines.extend(causes)
              else:
                  body_lines.append("Status: ✅ SUCCESS — CI passed (lint, test, docker smoke)")
                  if skipped: body_lines.append(f"Skipped: {', '.join(skipped)}")
                  body_lines.extend(causes)
                  body_lines.append("Acknowledgement: CI reviewers notified via GitHub Issue (email) — ready to merge/deploy.")
              body_lines.append("")
              body_lines.append("---")
              body_lines.append("This issue was auto-created by `notify` job to trigger GitHub Email notifications to assignees/mentioned reviewers. GitHub sends email to their registered address if they have Watch and Email notifications enabled.")
              body="\n".join(body_lines)
              f.write(f"body<<__BODY__\n{body}\n__BODY__\n")
          PY

      - name: Create GitHub Issue — Failure (triggers Email to reviewers)
        if: steps.msg.outputs.is_failure == 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        with:
          script: |
            const logins = (process.env.LOGINS || '').split(',').map(s=>s.trim()).filter(Boolean).slice(0,10);
            const title = process.env.SUBJECT;
            let body = process.env.BODY;
            if (logins.length) body += `\n\nCC: ${logins.map(l => '@' + l).join(' ')}`;
            const labels = ['ci-failure','notify'];
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                assignees: logins,
                labels
              });
              core.info('Created CI failure issue assigned to ' + logins.join(','));
            } catch(e) {
              core.warning('create with labels failed: '+e.message+' — retry without labels');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                assignees: logins
              });
            }

      - name: Create GitHub Issue — Success Ack (triggers Email to reviewers)
        if: steps.msg.outputs.is_success == 'true'
        uses: actions/github-script@v7
        env:
          SUBJECT: ${{ steps.msg.outputs.subject }}
          BODY: ${{ steps.msg.outputs.body }}
          LOGINS: ${{ steps.reviewers.outputs.logins }}
        with:
          script: |
            const logins = (process.env.LOGINS || '').split(',').map(s=>s.trim()).filter(Boolean).slice(0,10);
            const title = process.env.SUBJECT;
            let body = process.env.BODY;
            if (logins.length) body += `\n\nCC: ${logins.map(l => '@' + l).join(' ')}`;
            const labels = ['ci-success','notify'];
            try {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                assignees: logins,
                labels
              });
              core.info('Created CI success issue #' + data.number);
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: data.number,
                  state: 'closed'
                });
                core.info('Closed success issue (ack) — email already delivered');
              } catch(e){ core.warning('close failed: '+e.message); }
            } catch(e) {
              core.warning('create with labels failed: '+e.message);
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body,
                assignees: logins
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: data.number,
                state: 'closed'
              });
            }

      - name: Log cancelled — no email
        if: steps.msg.outputs.is_cancelled == 'true'
        run: |
          echo "::notice::CI cancelled — no email"
          echo "${{ steps.msg.outputs.body }}"
